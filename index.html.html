<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>A little letter</title>
  <style>
    :root {
      --bg: #111111;
      --paper: #f2e9d9;
      --paper-shadow: #d9cbb7;
      --ink: #342a24;
      --wine: #713d48;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 650ms ease, visibility 650ms ease;
    }
    .screen.active { opacity: 1; visibility: visible; }

    /* Alya intro: five taps, then move to the original choice screen */
    #intro { align-content: center; }
    .intro-wrap { display: grid; justify-items: center; gap: 13px; }
    .alya-button {
      width: min(72vw, 310px);
      height: min(66vh, 360px);
      padding: 0; border: 0; background: transparent; cursor: pointer;
      display: grid; place-items: end center; -webkit-tap-highlight-color: transparent;
    }
    .alya-button img {
      display: block; max-width: 100%; max-height: 100%; object-fit: contain;
      user-select: none; pointer-events: none;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.28)); transform-origin: 50% 80%;
    }
    .alya-button.poke img { animation: poke-shake 340ms ease; }
    .alya-button.finish img { animation: final-shake 520ms ease; }
    @keyframes poke-shake {
      0%,100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-7px) rotate(-2deg); }
      45% { transform: translateX(7px) rotate(2deg); }
      70% { transform: translateX(-4px) rotate(-1deg); }
    }
    @keyframes final-shake {
      0%,100% { transform: translateX(0) rotate(0) scale(1); }
      15% { transform: translateX(-12px) rotate(-4deg) scale(1.02); }
      35% { transform: translateX(12px) rotate(4deg) scale(1.02); }
      55% { transform: translateX(-8px) rotate(-2deg); }
      75% { transform: translateX(8px) rotate(2deg); }
    }
    .intro-prompt { margin: 0; color: #f2eee9; font-size: 16px; letter-spacing: .03em; }
    .poke-count { margin: 0; color: #8f8982; font: 13px Arial, sans-serif; }

    /* Opening choice screen */
    #choice {
      align-content: center;
      gap: 30px;
    }
    .prompt {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 400;
      letter-spacing: .02em;
    }
    .choices { display: flex; gap: 18px; }
    .choice-button {
      width: 68px;
      height: 58px;
      border: 0;
      border-radius: 5px;
      background: #fff;
      color: #111;
      font: 600 19px Georgia, serif;
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }
    .choice-button:hover { transform: translateY(-3px); background: #eee9e2; }
    .choice-button:focus-visible, .envelope-button:focus-visible, .replay:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 5px;
    }

    /* Envelope screen */
    #envelope-screen { overflow: hidden; }
    .envelope-wrap {
      display: grid;
      justify-items: center;
      gap: 25px;
      transform: translateY(12px);
    }
    .hint {
      margin: 0;
      color: #d5d0ca;
      font-size: 15px;
      letter-spacing: .04em;
      opacity: .88;
    }
    .envelope-button {
      position: relative;
      width: min( min(78vw, 390px), 390px);
      aspect-ratio: 1.55 / 1;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1000px;
      -webkit-tap-highlight-color: transparent;
    }
    .envelope {
      position: absolute;
      inset: 0;
      overflow: visible;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.34));
    }
    .envelope-back {
      position: absolute;
      inset: 0;
      background: #d9cbb7;
      border-radius: 7px;
    }
    .letter {
      position: absolute;
      z-index: 1;
      left: 8%;
      width: 84%;
      height: 90%;
      bottom: 3%;
      padding: 23px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 3px;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      transform: translateY(0);
      transition: transform 1.15s cubic-bezier(.2,.75,.2,1) .25s;
    }
    .letter p {
      margin: 0;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 650ms ease, transform 650ms ease;
      text-align: center;
    }
    .letter .hey { font-size: clamp(24px, 5vw, 31px); font-style: italic; }
    .letter .middle { font-size: clamp(15px, 3.5vw, 19px); }
    .letter .sorry { font-size: clamp(20px, 4.5vw, 26px); }
    .letter .sad { font: 28px Arial, sans-serif; }
    .envelope-front {
      position: absolute;
      z-index: 3;
      inset: 0;
      background: #eee3d2;
      clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%);
      border-radius: 0 0 7px 7px;
    }
    .envelope-flap {
      position: absolute;
      z-index: 4;
      inset: 0;
      background: #e6d8c4;
      clip-path: polygon(0 0, 100% 0, 50% 61%);
      transform-origin: top center;
      transition: transform 850ms ease, z-index 0ms linear 425ms;
      backface-visibility: hidden;
    }
    .seal {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 57%;
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--wine);
      color: #f5e8d9;
      font: 18px Georgia, serif;
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
      transition: opacity 250ms ease;
    }
    .envelope-button.opened .envelope-flap {
      transform: rotateX(180deg);
      z-index: 0;
    }
    .envelope-button.opened .seal { opacity: 0; }
    .envelope-button.opened .letter { transform: translateY(-72%); }
    .envelope-button.opened .letter p {
      opacity: 1;
      transform: translateY(0);
    }
    .envelope-button.opened .letter .hey { transition-delay: 1.1s; }
    .envelope-button.opened .letter .middle { transition-delay: 2.0s; }
    .envelope-button.opened .letter .sorry { transition-delay: 2.9s; }
    .envelope-button.opened .letter .sad { transition-delay: 3.8s; }

    .replay {
      position: absolute;
      bottom: 24px;
      border: 0;
      background: transparent;
      color: #aaa39a;
      font: 13px Georgia, serif;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 500ms ease 4.5s;
    }
    .replay.visible { opacity: 1; pointer-events: auto; }
    .replay:hover { color: #fff; }

    @media (max-width: 480px) {
      .letter { padding: 14px 10px; gap: 9px; }
      .envelope-button.opened .letter { transform: translateY(-67%); }
      .seal { width: 37px; height: 37px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>

        <p class="intro-prompt" id="poke-prompt">Poke her 5 times</p>
        <p class="poke-count" id="poke-count">0 / 5</p>
      </div>
    </section>

    <section class="screen" id="choice" aria-label="Choose one">
      <h1 class="prompt">Choose one</h1>
      <div class="choices">
        <button class="choice-button" type="button" data-choice="1">1</button>
        <button class="choice-button" type="button" data-choice="2">2</button>
      </div>
    </section>

    <section class="screen" id="envelope-screen" aria-label="A letter for you">
      <div class="envelope-wrap">
        <button class="envelope-button" id="envelope" type="button" aria-label="Open the letter">
          <span class="envelope">
            <span class="envelope-back"></span>
            <span class="letter" aria-live="polite">
              <p class="hey">H-hey kaity..</p>
              <p class="middle">I-i..i just wanted to say</p>
              <p class="sorry">I'm sorry for being a baka</p>
              <p class="sad">:(</p>
            </span>
            <span class="envelope-front"></span>
            <span class="envelope-flap"></span>
            <span class="seal" aria-hidden="true">♡</span>
          </span>
        </button>
        <p class="hint" id="hint">C-click to open.</p>
      </div>
      <button class="replay" id="replay" type="button">Start over</button>
    </section>
  </main>

  <script>
    const introScreen = document.getElementById('intro');
    const choiceScreen = document.getElementById('choice');
    const envelopeScreen = document.getElementById('envelope-screen');
    const alya = document.getElementById('alya');
    const pokeCount = document.getElementById('poke-count');
    const pokePrompt = document.getElementById('poke-prompt');
    const envelope = document.getElementById('envelope');
    const hint = document.getElementById('hint');
    const replay = document.getElementById('replay');
    let pokes = 0;
    let transitioning = false;

    alya.addEventListener('click', () => {
      if (transitioning || pokes >= 5) return;
      pokes += 1;
      pokeCount.textContent = `${pokes} / 5`;
      alya.classList.remove('poke');
      void alya.offsetWidth;
      alya.classList.add('poke');

      if (pokes === 5) {
        transitioning = true;
        pokePrompt.textContent = 'Okay, okay...';
        alya.classList.remove('poke');
        void alya.offsetWidth;
        alya.classList.add('finish');
        window.setTimeout(() => {
          introScreen.classList.remove('active');
          choiceScreen.classList.add('active');
        }, 850);
      }
    });

    document.querySelectorAll('[data-choice]').forEach(button => {
      button.addEventListener('click', () => {
        choiceScreen.classList.remove('active');
        envelopeScreen.classList.add('active');
      });
    });

    envelope.addEventListener('click', () => {
      if (envelope.classList.contains('opened')) return;
      envelope.classList.add('opened');
      hint.textContent = '';
      replay.classList.add('visible');
    });

    replay.addEventListener('click', () => {
      envelope.classList.remove('opened');
      replay.classList.remove('visible');
      hint.textContent = 'C-click to open.';
      envelopeScreen.classList.remove('active');
      introScreen.classList.add('active');
      pokes = 0;
      transitioning = false;
      pokeCount.textContent = '0 / 5';
      pokePrompt.textContent = 'Poke her 5 times';
      alya.classList.remove('finish', 'poke');
    });
  </script>
</body>
</html>
